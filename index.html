<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dependencia ofensiva</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body style="font-family: Arial; text-align: center; margin: 0;">

<h2 style="margin-bottom: 5px;">¿Qué equipos dependen más de su goleador?</h2>

<p style="color: gray; margin-top: 0;">
  Datos correspondientes a la Premier League temporada 2025–2026
</p>

<p style="font-size: 12px; color: gray;">
  El tamaño de las pelotas representa los goles totales del equipo
</p>

<div id="chart" style="width:1100px;height:600px;margin:auto;"></div>

<script>

var data = [
  {Equipo:"Arsenal", dep:19, total:57, goleador:"Viktor Gyökeres", goles:11},
  {Equipo:"Aston Villa", dep:23, total:40, goleador:"Ollie Watkins", goles:9},
  {Equipo:"Bournemouth", dep:25, total:36, goleador:"Eli Junior Kroupi", goles:9},
  {Equipo:"Brentford", dep:42, total:45, goleador:"Igor Thiago", goles:19},
  {Equipo:"Brighton", dep:30, total:40, goleador:"Danny Welbeck", goles:12},
  {Equipo:"Burnley", dep:27, total:30, goleador:"Zian Flemming", goles:8},
  {Equipo:"Chelsea", dep:27, total:52, goleador:"João Pedro", goles:14},
  {Equipo:"Crystal Palace", dep:24, total:33, goleador:"Jean-Philippe Mateta", goles:8},
  {Equipo:"Everton", dep:17, total:35, goleador:"Thierno Barry", goles:6},
  {Equipo:"Fulham", dep:26, total:39, goleador:"Harry Wilson", goles:10},
  {Equipo:"Leeds", dep:27, total:37, goleador:"Dominic Calvert-Lewin", goles:10},
  {Equipo:"Liverpool", dep:23, total:48, goleador:"Hugo Ekitiké", goles:11},
  {Equipo:"Manchester City", dep:32, total:69, goleador:"Erling Haaland", goles:22},
  {Equipo:"Manchester United", dep:17, total:53, goleador:"Bryan Mbeumo", goles:9},
  {Equipo:"Newcastle", dep:20, total:44, goleador:"Bruno Guimarães", goles:9},
  {Equipo:"Nottingham Forest", dep:29, total:31, goleador:"Morgan Gibbs-White", goles:9},
  {Equipo:"Sunderland", dep:21, total:29, goleador:"Brian Brobbey", goles:6},
  {Equipo:"Tottenham", dep:24, total:37, goleador:"Richarlison", goles:9},
  {Equipo:"West Ham", dep:24, total:34, goleador:"Jarrod Bowen", goles:8},
  {Equipo:"Wolverhampton", dep:14, total:22, goleador:"Tolu Arokodare", goles:3}
];

// ordenar
data.sort(function(a,b){
  return b.dep - a.dep;
});

var equipos = [];
var dependencia = [];
var sizes = [];
var colors = [];
var hoverInfo = [];

for (var i = 0; i < data.length; i++) {
  equipos.push(data[i].Equipo);
  dependencia.push(data[i].dep);
  sizes.push(data[i].total / 2);
  hoverInfo.push("<b>" + data[i].goleador + "</b><br>" + data[i].goles + " goles");

  if (data[i].dep >= 35) {
    colors.push("red");
  } else if (data[i].dep >= 30) {
    colors.push("orange");
  } else {
    colors.push("blue");
  }
}

var trace = {
  x: dependencia,
  y: equipos,
  text: hoverInfo,
  mode: "markers",
  type: "scatter",
  hovertemplate:
    "%{y}<br>" +
    "Dependencia: %{x}%<br>" +
    "%{text}" +
    "<extra></extra>",
  marker: {
    size: sizes,
    color: colors
  }
};

var layout = {
  hovermode: "closest",
  xaxis: {
    title: "Dependencia (%)",
    range: [0,50]
  },
  yaxis: {
    autorange: "reversed"
  },
  margin: {
    l: 180,
    t: 10
  },
  shapes: [
    {
      type: "line",
      x0: 25,
      x1: 25,
      y0: -1,
      y1: data.length,
      line: {
        dash: "dash",
        color: "gray"
      }
    }
  ]
};

Plotly.newPlot("chart", [trace], layout, {
  displayModeBar: false,
});

</script>

</body>
</html>
