<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cámara</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <script src="https://app.protobject.com/framework/p.js"></script>
  <script src="config.js"></script>

  <script>
    const arucoMarkers = {
      1: "injury:dependiente",
      2: "injury:equilibrado",
      3: "injury:ambos"
    };

    let ultimoMensaje = null;

    function enviar(mensaje) {
      if (mensaje === ultimoMensaje) return;
      ultimoMensaje = mensaje;
      console.log("Enviando:", mensaje);
      Protobject.Core.send(mensaje).to("index.html");
    }

    Protobject.Aruco.start(30, 1);

    Protobject.Aruco.showPreview({
      top: 0,
      left: 0,
      width: window.innerWidth,
      height: window.innerHeight
    });

    Protobject.Aruco.onData((data) => {
      const detectedMarkers = Object.keys(data);

      if (detectedMarkers.length === 0) {
        enviar(false);
        return;
      }

      const markerId = detectedMarkers[0];
      const mensaje = arucoMarkers[markerId];

      if (mensaje) {
        enviar(mensaje);
      } else {
        console.warn("Marcador no asignado:", markerId);
        enviar(false);
      }
    });
  </script>
</body>
</html>
